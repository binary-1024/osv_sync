source:
  base_url: "https://storage.googleapis.com/osv-vulnerabilities"
  index_url: "https://storage.googleapis.com/osv-vulnerabilities/index.html"
  all_zip_url: "https://storage.googleapis.com/osv-vulnerabilities/all.zip"

storage:
  data_dir: "data"
  logs_dir: "logs"
  # 文件名以这些前缀开头的通告不解压、不入库(2026-09-07 起上游一次性多出 41.6 万个 CGA-* Chainguard/apk 通告,
  # 百万文件的 commit 在 runner 上跑不完;下游 data-infra 不消费 pkg:apk)。已在仓里的 4.4 万个 CGA 文件保持不动。
  exclude_prefixes: ["CGA-"]

recording:
  file_path: "logs/sync_history.csv"

sync:
  timeout: 3000
  retry_attempts: 3

browser:
  browser_type: "chromium"  # firefox, webkit, chromium
  headless: true
  timeout: 30000
  viewport:
    width: 1280
    height: 800
  options:
    args: ["--disable-gpu", "--no-sandbox"] 